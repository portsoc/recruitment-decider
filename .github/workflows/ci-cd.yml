# Tests every push and pull request; when main passes, checks and publishes
# firestore.rules, then publishes the site to Firebase Hosting.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --check forecast.js && node --check deploy.js && node --check test_rules.js
      - run: node verify_math.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://uop-recruitment-decider.web.app
    # Never run two releases at once; a newer push waits for the current one.
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Keyless sign-in: GitHub's OIDC token is exchanged for a short-lived
      # token for github-deploy@, via the "github" Workload Identity pool,
      # which only accepts runs from portsoc/recruitment-decider on main.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      # The rules checks need Google credentials, so they run here rather than in test.
      - run: node test_rules.js
      - run: node deploy.js
